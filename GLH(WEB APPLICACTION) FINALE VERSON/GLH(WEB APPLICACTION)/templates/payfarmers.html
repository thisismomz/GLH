<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='part1.css') }}">
    <meta charset="utf-8" />
    <title></title>
    <style>
  .hero-image {
      background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url("{{ url_for('static', filename='uploads/hero4.jpg') }}");
  }

    form {
        color: black; /* Makes all standard text inside the form black */
    }

    label {
        display: block; /* Puts labels on their own line for a cleaner look */
        margin-top: 10px;
        color: black;
    }

    input {
        color: black; /* Makes the text the user types black */
        border: 1px solid #ccc;
        padding: 5px;
    }


    </style>
</head>
<body>
    <div class="hero-image">
        <div class="hero-text">
            <form action="/payfarmers" method="post">
                <!-- Bank Details -->

                    <legend>Bank Account Details</legend>

                    <label for="account_name">Full Name on Account:</label>
                    <input type="text" id="account_name" name="account_name" required autocomplete="name">

                    <label for="sort_code">Sort Code:</label>
                    <input type="text"
                           id="sort_code"
                           name="sort_code"
                           pattern="\d{6}"
                           maxlength="6"
                           minlength="6"
                           placeholder="123456"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                           required>

                    <label for="account_number">Account Number:</label>
                    <input type="text"
                           id="account_number"
                           name="account_number"
                           pattern="\d{8}"
                           maxlength="8"
                           minlength="8"
                           placeholder="8 digits"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                           required>
          

                <!-- Tax Compliance -->
            
                    <legend>Tax & Compliance</legend>

                    <label for="tax_id">Business Tax ID / VAT Number:</label>
                    <input type="text" id="tax_id" name="tax_id" required>

                    <div class="compliance-checkbox">
                        <input type="checkbox" id="tax_declaration" name="tax_declaration" required>
                        <label for="tax_declaration">I confirm these details are correct for tax reporting purposes.</label>
                    </div>
                </fieldset>

                <button type="submit" style="margin-top: 15px;">Save Payment Details</button>
            </form>
        </div>
    </div>
</body>
    <footer>
        <p><a href="/DataRequirementsGuide">Data Requirements Guide</a></p>
    </footer>

</html>
