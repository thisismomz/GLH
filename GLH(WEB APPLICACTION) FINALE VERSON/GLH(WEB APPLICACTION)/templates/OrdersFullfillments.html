<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='part1.css') }}">
    <style>
        .hero-image {
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                              url("{{ url_for('static', filename='uploads/hero5.jpg') }}");
            height: 100vh;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .construction-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: block;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.1em;
            color: #ccc;
            margin-bottom: 30px;
        }

        .back-button {
            background-color: #ff4b2b;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: 0.3s;
            display: inline-block;
        }

        .back-button:hover {
            background-color: #ff416c;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="hero-image">
        <div class="construction-card">
            <span class="icon"></span>
            <h1>Under Construction</h1>
            <p>We are currently updating the Order fullfiment  system. This page will be back online shortly!</p>

            <a href="/home" class="back-button">Return to Home</a>
        </div>
    </div>
</body>
</html>
